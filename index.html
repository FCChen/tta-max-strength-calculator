<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">TTA 軍力最佳化計算機</title>
    <style>
        :root {
            --primary: #B91C1C;
            --primary-hover: #991B1B;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --border: #D1D5DB;
            --success-bg: #FEF2F2;
            --success-text: #991B1B;
            --success-border: #F87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding: 1rem; -webkit-font-smoothing: antialiased; }
        .container { max-width: 650px; margin: 0 auto; position: relative; }
        
        .lang-btn {
            position: absolute; top: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border);
            padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; color: var(--text-muted);
        }
        .lang-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        
        .header { text-align: center; margin-bottom: 1.5rem; padding-top: 1.5rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 0.25rem; }
        .header p { font-size: 0.875rem; color: var(--text-muted); }

        .card { background-color: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1rem; border: 1px solid var(--border); }
        
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main); border-bottom: 2px solid var(--bg); padding-bottom: 0.5rem; }
        
        /* Input Row Responsive */
        .input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; }
        
        /* Number Input Wrapper (for +/- buttons) */
        .num-wrap { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--card-bg); transition: 0.15s; width: 100%; }
        .num-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1); }
        .num-wrap button { flex: 0 0 32px; height: 36px; background: #F3F4F6; border: none; font-size: 1.1rem; font-weight: bold; color: var(--text-muted); cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .num-wrap button:active { background: #E5E7EB; }
        .num-wrap input { flex: 1; min-width: 0; text-align: center; border: none; padding: 0.4rem 0; font-size: 1rem; background: transparent; color: var(--text-main); width: 100%; }
        .num-wrap input:focus { outline: none; }
        .num-wrap.disabled { background-color: #E5E7EB; opacity: 0.7; border-color: transparent; }
        .num-wrap.disabled button { cursor: not-allowed; color: #9CA3AF; }
        
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* Tactic Image Grid */
        .tactic-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.5rem;
            max-height: 280px; overflow-y: auto; padding: 0.5rem; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1rem;
        }
        .tactic-card { display: block; position: relative; cursor: pointer; }
        .tactic-card input { position: absolute; opacity: 0; width: 0; height: 0; }
        .tactic-content { border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: white; text-align: center; transition: 0.2s; height: 100%; display: flex; flex-direction: column; justify-content: space-between;}
        .tactic-card input:checked + .tactic-content { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(185, 28, 28, 0.2); }
        .tactic-content img { width: 100%; height: 70px; object-fit: contain; background: #E5E7EB; display: block; }
        .tactic-content .no-img { height: 70px; display: flex; align-items: center; justify-content: center; background: #E5E7EB; color: #9CA3AF; font-size: 0.8rem; }
        .tactic-content span { display: block; font-size: 0.75rem; padding: 0.4rem; font-weight: 600; color: var(--text-main); line-height: 1.2; }

        /* Unit Grid */
        .unit-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 0.5rem; align-items: center; text-align: center; margin-bottom: 1rem; font-size: 0.875rem; }
        .unit-grid .header-cell { font-weight: 600; color: var(--text-muted); }
        .unit-grid .label-cell { font-weight: 600; text-align: right; padding-right: 0.5rem; }

        .radio-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .radio-btn { flex: 1; position: relative; }
        .radio-btn input { position: absolute; opacity: 0; width: 0; height: 0; }
        .radio-btn label { display: block; padding: 0.5rem 0; text-align: center; background-color: #F3F4F6; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.875rem; touch-action: manipulation; }
        .radio-btn input:checked + label { background-color: var(--primary); color: white; border-color: var(--primary); }

        button.calculate-btn { width: 100%; padding: 0.875rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        button.calculate-btn:hover { background-color: var(--primary-hover); }

        #result-container { display: none; margin-top: 1rem; padding: 1.25rem; border-radius: 12px; background-color: var(--success-bg); border: 1px solid var(--success-border); }
        .res-title { font-size: 1.1rem; font-weight: 700; color: var(--success-text); margin-bottom: 0.5rem; }
        .res-str { font-size: 2.5rem; font-weight: 800; color: var(--primary); line-height: 1.2; margin-top: 0.2rem; }
        .res-breakdown { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
        .res-detail { font-size: 0.9rem; margin-top: 0.5rem; color: var(--text-main); font-weight: 500; }
        .path-list { margin-top: 0.75rem; padding-left: 1.5rem; font-size: 0.875rem; color: var(--text-main); }
        .path-list li { margin-bottom: 0.35rem; }
    </style>
</head>
<body>

<div class="container">
    <button class="lang-btn" onclick="toggleLang()">🌐 EN / TW</button>
    <div class="header">
        <h1 data-i18n="title">TTA 軍力最佳化計算機</h1>
        <p data-i18n="subtitle">給定資源與陣型，計算最大潛在武力</p>
    </div>

    <div class="card">
        <!-- 資源區 -->
        <div class="section-title" data-i18n="sec_resources">可用資源</div>
        <div class="input-row">
            <div class="input-group">
                <label data-i18n="label_ma">軍事行動點 (MA)</label>
                <div class="num-wrap">
                    <button type="button" onclick="stepVal('in_ma', -1)">-</button>
                    <input type="number" id="in_ma" value="4" min="0">
                    <button type="button" onclick="stepVal('in_ma', 1)">+</button>
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="label_mins">礦物 (Minerals)</label>
                <div class="num-wrap">
                    <button type="button" onclick="stepVal('in_mins', -1)">-</button>
                    <input type="number" id="in_mins" value="10" min="0">
                    <button type="button" onclick="stepVal('in_mins', 1)">+</button>
                </div>
            </div>
            <div class="input-group">
                <label data-i18n="label_pop">閒置人口 (Pop)</label>
                <div class="num-wrap">
                    <button type="button" onclick="stepVal('in_pop', -1)">-</button>
                    <!-- 預設改為 99 -->
                    <input type="number" id="in_pop" value="99" min="0">
                    <button type="button" onclick="stepVal('in_pop', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- 陣型區 -->
        <div class="section-title" data-i18n="sec_tactic">目標陣型</div>
        <div class="tactic-grid" id="tactic-container"></div>
        <div class="radio-group">
            <div class="radio-btn"><input type="radio" name="tac_src" id="src_active" value="0" checked><label for="src_active" data-i18n="src_active">已在場上 (0 MA)</label></div>
            <div class="radio-btn"><input type="radio" name="tac_src" id="src_hand" value="1"><label for="src_hand" data-i18n="src_hand">從手中打出 (1 MA)</label></div>
            <div class="radio-btn"><input type="radio" name="tac_src" id="src_common" value="2"><label for="src_common" data-i18n="src_common">複製公共 (2 MA)</label></div>
        </div>

        <!-- 兵種區 -->
        <div class="section-title" data-i18n="sec_units">現有兵種數量</div>
        <div class="unit-grid">
            <div></div>
            <div class="header-cell" data-i18n="lbl_art">砲兵 (Art)</div>
            <div class="header-cell" data-i18n="lbl_cav">騎兵 (Cav)</div>
            <div class="header-cell" data-i18n="lbl_inf">步兵 (Inf)</div>
            
            <div class="label-cell">III (5武/7礦)</div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_artIII', -1)">-</button><input type="number" id="u_artIII" value="0" min="0"><button type="button" onclick="stepVal('u_artIII', 1)">+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_cavIII', -1)">-</button><input type="number" id="u_cavIII" value="0" min="0"><button type="button" onclick="stepVal('u_cavIII', 1)">+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_infIII', -1)">-</button><input type="number" id="u_infIII" value="0" min="0"><button type="button" onclick="stepVal('u_infIII', 1)">+</button></div>

            <div class="label-cell">II (3武/5礦)</div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_artII', -1)">-</button><input type="number" id="u_artII" value="0" min="0"><button type="button" onclick="stepVal('u_artII', 1)">+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_cavII', -1)">-</button><input type="number" id="u_cavII" value="0" min="0"><button type="button" onclick="stepVal('u_cavII', 1)">+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_infII', -1)">-</button><input type="number" id="u_infII" value="0" min="0"><button type="button" onclick="stepVal('u_infII', 1)">+</button></div>

            <div class="label-cell">I (2武/3礦)</div>
            <div class="num-wrap disabled"><button type="button" disabled>-</button><input type="number" disabled value="-"><button type="button" disabled>+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_cavI', -1)">-</button><input type="number" id="u_cavI" value="0" min="0"><button type="button" onclick="stepVal('u_cavI', 1)">+</button></div>
            <div class="num-wrap"><button type="button" onclick="stepVal('u_infI', -1)">-</button><input type="number" id="u_infI" value="0" min="0"><button type="button" onclick="stepVal('u_infI', 1)">+</button></div>

            <div class="label-cell">A (1武/2礦)</div>
            <div class="num-wrap disabled"><button type="button" disabled>-</button><input type="number" disabled value="-"><button type="button" disabled>+</button></div>
            <div class="num-wrap disabled"><button type="button" disabled>-</button><input type="number" disabled value="-"><button type="button" disabled>+</button></div>
            <!-- 預設值改為 0 -->
            <div class="num-wrap"><button type="button" onclick="stepVal('u_infA', -1)">-</button><input type="number" id="u_infA" value="0" min="0"><button type="button" onclick="stepVal('u_infA', 1)">+</button></div>
        </div>

        <button class="calculate-btn" onclick="runCalculation()" data-i18n="btn_calc">計算最大武力</button>

        <div id="result-container">
            <div class="res-title" id="res-title">計算結果</div>
            <div class="res-detail" id="res-current">目前基礎武力：</div>
            <div class="res-detail" data-i18n="res_max_label" style="margin-top: 0.75rem;">最大潛在武力：</div>
            <div class="res-str" id="res-max">--</div>
            <div class="res-breakdown" id="res-breakdown">--</div>
            
            <div class="res-detail" id="res-cost">消耗：-- MA, -- 礦物, -- 人口</div>
            <div class="res-detail" style="margin-top:0.75rem; font-weight:700;" data-i18n="res_path">最佳行動順序：</div>
            <ul class="path-list" id="res-path-list"></ul>
        </div>
    </div>
</div>

<script>
    const dict = {
        'TW': {
            'title': 'TTA 軍力最佳化計算機', 'subtitle': '給定資源與陣型，計算最大潛在武力',
            'sec_resources': '可用資源', 'label_ma': '軍事行動點 (MA)', 'label_mins': '礦物 (Minerals)', 'label_pop': '閒置人口 (Pop)',
            'sec_tactic': '目標陣型', 'src_active': '已在場上 (0 MA)', 'src_hand': '從手中打出 (1 MA)', 'src_common': '複製公共 (2 MA)',
            'sec_units': '現有兵種數量', 'lbl_inf': '步兵 (Inf)', 'lbl_cav': '騎兵 (Cav)', 'lbl_art': '砲兵 (Art)',
            'btn_calc': '計算最大武力', 'res_max_label': '最大潛在武力：', 'res_path': '最佳行動順序：', 'err_ma': '錯誤：軍事行動點不足以打出該陣型！', 'no_tactic': '無陣型'
        },
        'EN': {
            'title': 'TTA Military Optimizer', 'subtitle': 'Calculate max strength based on resources & tactics',
            'sec_resources': 'Available Resources', 'label_ma': 'Military Actions (MA)', 'label_mins': 'Minerals', 'label_pop': 'Idle Pop',
            'sec_tactic': 'Target Tactic', 'src_active': 'Active (0 MA)', 'src_hand': 'From Hand (1 MA)', 'src_common': 'Copy Common (2 MA)',
            'sec_units': 'Current Units', 'lbl_inf': 'Infantry', 'lbl_cav': 'Cavalry', 'lbl_art': 'Artillery',
            'btn_calc': 'Calculate Max', 'res_max_label': 'Max Potential Strength:', 'res_path': 'Optimal Action Sequence:', 'err_ma': 'Error: Not enough MA to play tactic!', 'no_tactic': 'No Tactic'
        }
    };
    
    let lang = 'TW';
    function toggleLang() {
        lang = (lang === 'TW') ? 'EN' : 'TW';
        document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[lang][el.getAttribute('data-i18n')]);
        renderTacticOptions();
    }

    // Number input stepper function
    function stepVal(id, delta) {
        let el = document.getElementById(id);
        let val = parseInt(el.value, 10) || 0;
        let min = parseInt(el.min, 10) || 0;
        val += delta;
        if (val < min) val = min;
        el.value = val;
    }

    const UNIT_DB = [
        { id: 0, n_tw: '步兵 A', n_en: 'Inf A', type: 'inf', age: 0, cost: 2, str: 1 },
        { id: 1, n_tw: '步兵 I', n_en: 'Inf I', type: 'inf', age: 1, cost: 3, str: 2 },
        { id: 2, n_tw: '步兵 II', n_en: 'Inf II', type: 'inf', age: 2, cost: 5, str: 3 },
        { id: 3, n_tw: '步兵 III', n_en: 'Inf III', type: 'inf', age: 3, cost: 7, str: 5 },
        { id: 4, n_tw: '騎兵 I', n_en: 'Cav I', type: 'cav', age: 1, cost: 3, str: 2 },
        { id: 5, n_tw: '騎兵 II', n_en: 'Cav II', type: 'cav', age: 2, cost: 5, str: 3 },
        { id: 6, n_tw: '騎兵 III', n_en: 'Cav III', type: 'cav', age: 3, cost: 7, str: 5 },
        { id: 7, n_tw: '砲兵 II', n_en: 'Art II', type: 'art', age: 2, cost: 5, str: 3 },
        { id: 8, n_tw: '砲兵 III', n_en: 'Art III', type: 'art', age: 3, cost: 7, str: 5 }
    ];

    const TACTICS = [
        { id: 'none', img: null, n_tw: '無陣型', n_en: 'No Tactic', age: 0, req: {i:0, c:0, a:0}, f: 0, ant: 0 },
        { id: 't1', img: 'tactic/age1-1.png', n_tw: 'I: 兵陣 (2步)', n_en: 'I: Fighting Band', age: 1, req: {i:2, c:0, a:0}, f: 1, ant: 1 },
        { id: 't2', img: 'tactic/age1-2.png', n_tw: 'I: 軍團 (3步)', n_en: 'I: Legion', age: 1, req: {i:3, c:0, a:0}, f: 2, ant: 2 },
        { id: 't3', img: 'tactic/age1-3.png', n_tw: 'I: 中古 (1步1騎)', n_en: 'I: Medieval', age: 1, req: {i:1, c:1, a:0}, f: 2, ant: 2 },
        { id: 't4', img: 'tactic/age1-4.png', n_tw: 'I: 方陣 (2步1騎)', n_en: 'I: Phalanx', age: 1, req: {i:2, c:1, a:0}, f: 3, ant: 3 },
        { id: 't5', img: 'tactic/age1-5.png', n_tw: 'I: 重騎兵 (3騎)', n_en: 'I: Heavy Cavalry', age: 1, req: {i:0, c:3, a:0}, f: 4, ant: 4 },
        
        { id: 't6', img: 'tactic/age2-1.png', n_tw: 'II: 拿破崙 (1步1騎1砲)', n_en: 'II: Napoleonic', age: 2, req: {i:1, c:1, a:1}, f: 7, ant: 4 },
        { id: 't7', img: 'tactic/age2-2.png', n_tw: 'II: 防禦 (2步1砲)', n_en: 'II: Defensive', age: 2, req: {i:2, c:0, a:1}, f: 6, ant: 3 },
        { id: 't8', img: 'tactic/age2-3.png', n_tw: 'II: 征服者 (1步2騎)', n_en: 'II: Conquistadors', age: 2, req: {i:1, c:2, a:0}, f: 5, ant: 3 },
        { id: 't9', img: 'tactic/age2-4.png', n_tw: 'II: 防禦工事 (2砲)', n_en: 'II: Entrenchments', age: 2, req: {i:0, c:0, a:2}, f: 5, ant: 3 },
        { id: 't10', img: 'tactic/age2-5.png', n_tw: 'II: 古典 (2步2騎)', n_en: 'II: Classic', age: 2, req: {i:2, c:2, a:0}, f: 8, ant: 4 },
        { id: 't11', img: 'tactic/age2-6.png', n_tw: 'II: 機動 (1騎1砲)', n_en: 'II: Mobile', age: 2, req: {i:0, c:1, a:1}, f: 5, ant: 3 },
        { id: 'spec', img: 'tactic/age2-7.png', n_tw: 'II: 輕騎兵 (2騎)', n_en: 'II: Hussars', age: 2, req: {i:0, c:2, a:0}, f: 'sp', ant: 'sp' },
        
        { id: 't12', img: 'tactic/age3-1.png', n_tw: 'III: 戰壕 (1步2砲)', n_en: 'III: Trench', age: 3, req: {i:1, c:0, a:2}, f: 9, ant: 5 },
        { id: 't13', img: 'tactic/age3-2.png', n_tw: 'III: 現代化部隊 (2步1騎1砲)', n_en: 'III: Modern', age: 3, req: {i:2, c:1, a:1}, f: 13, ant: 7 },
        { id: 't14', img: 'tactic/age3-3.png', n_tw: 'III: 機械化 (1騎2砲)', n_en: 'III: Mechanized', age: 3, req: {i:0, c:1, a:2}, f: 10, ant: 5 },
        { id: 't15', img: 'tactic/age3-4.png', n_tw: 'III: 突擊部隊 (1步3騎)', n_en: 'III: Shock', age: 3, req: {i:1, c:3, a:0}, f: 11, ant: 6 },
        { id: 't16', img: 'tactic/age3-5.png', n_tw: 'III: 陣地部隊 (2步2砲)', n_en: 'III: Positional', age: 3, req: {i:2, c:0, a:2}, f: 12, ant: 6 }
    ];

    function renderTacticOptions() {
        const container = document.getElementById('tactic-container');
        const currentChecked = document.querySelector('input[name="in_tactic"]:checked')?.value || 'none';
        container.innerHTML = '';
        
        TACTICS.forEach(t => {
            let label = document.createElement('label');
            label.className = 'tactic-card';
            
            let isChecked = t.id === currentChecked ? 'checked' : '';
            let imgHtml = t.img ? `<img src="${t.img}" alt="${t.n_tw}">` : `<div class="no-img">${dict[lang]['no_tactic']}</div>`;
            let name = lang === 'TW' ? t.n_tw : t.n_en;
            
            label.innerHTML = `
                <input type="radio" name="in_tactic" value="${t.id}" ${isChecked}>
                <div class="tactic-content">
                    ${imgHtml}
                    <span>${name}</span>
                </div>
            `;
            container.appendChild(label);
        });
    }
    renderTacticOptions();

    // TARGETS format: array of valid upgrade indices. 
    const TARGETS = [ [0,1,2,3], [1,2,3], [2,3], [3], [4,5,6], [5,6], [6], [7,8], [8] ];
    let memoParts = {};
    
    function getParts(n, k) {
        let key = n+','+k; if(memoParts[key]) return memoParts[key];
        if(k === 1) return [[n]]; let res = [];
        for(let i=0; i<=n; i++) { let sub = getParts(n-i, k-1); for(let s of sub) res.push([i, ...s]); }
        memoParts[key] = res; return res;
    }

    function evaluateStr(u, t) {
        let base = 0; for(let i=0; i<9; i++) base += u[i] * UNIT_DB[i].str;
        if(t.id === 'none') return { total: base, base, bonus: 0 };
        
        if(t.id === 'spec') {
            let cavs = [];
            for(let i=0; i<u[6]; i++) cavs.push(3);
            for(let i=0; i<u[5]; i++) cavs.push(2);
            for(let i=0; i<u[4]; i++) cavs.push(1);
            let b = 0;
            while(cavs.length >= 2) { let c1=cavs.shift(); let c2=cavs.shift(); b += (2 + Math.min(c1, c2)); }
            return { total: base+b, base, bonus: b };
        }
        
        let c = { i:0, c:0, a:0 }, v = { i:0, c:0, a:0 };
        for(let i=0; i<=3; i++) { c.i += u[i]; if(UNIT_DB[i].age >= t.age) v.i += u[i]; }
        for(let i=4; i<=6; i++) { c.c += u[i]; if(UNIT_DB[i].age >= t.age) v.c += u[i]; }
        for(let i=7; i<=8; i++) { c.a += u[i]; if(UNIT_DB[i].age >= t.age) v.a += u[i]; }
        
        let mf = Infinity, mt = Infinity;
        if(t.req.i > 0) { mf = Math.min(mf, Math.floor(v.i/t.req.i)); mt = Math.min(mt, Math.floor(c.i/t.req.i)); }
        if(t.req.c > 0) { mf = Math.min(mf, Math.floor(v.c/t.req.c)); mt = Math.min(mt, Math.floor(c.c/t.req.c)); }
        if(t.req.a > 0) { mf = Math.min(mf, Math.floor(v.a/t.req.a)); mt = Math.min(mt, Math.floor(c.a/t.req.a)); }
        if(mf === Infinity) mf = 0; if(mt === Infinity) mt = 0;
        
        let b = mf * t.f + (mt - mf) * t.ant;
        return { total: base+b, base, bonus: b };
    }

    function runCalculation() {
        const C = (id) => parseInt(document.getElementById(id).value, 10) || 0;
        let init_ma = C('in_ma'), mins = C('in_mins'), pop = C('in_pop');
        let tacCost = parseInt(document.querySelector('input[name="tac_src"]:checked').value, 10);
        let tacId = document.querySelector('input[name="in_tactic"]:checked').value;
        let tac = TACTICS.find(t => t.id === tacId);
        let resDiv = document.getElementById('result-container');
        
        if (init_ma < tacCost) {
            resDiv.style.display = 'block'; resDiv.style.backgroundColor = '#FEF2F2';
            resDiv.innerHTML = `<div class="res-title" style="color:#B91C1C;">${dict[lang]['err_ma']}</div>`;
            return;
        }

        let init_u = [C('u_infA'), C('u_infI'), C('u_infII'), C('u_infIII'), C('u_cavI'), C('u_cavII'), C('u_cavIII'), C('u_artII'), C('u_artIII')];
        let curr_eval = evaluateStr(init_u, {id:'none'});
        
        let best = { str: -1, state: null, path: [] };
        
        function dfs(step, r_ma, r_min, r_pop, u, path) {
            // Depth 18: Evaluation
            if(step === 18) {
                let e = evaluateStr(u, tac);
                if(e.total > best.str) { best.str = e.total; best.state = {u:[...u], ma: r_ma, min: r_min, pop: r_pop, e: e}; best.path = [...path]; }
                return;
            }
            
            // Depth 0-8: Upgrading existing units
            if (step < 9) {
                let limit = init_u[step];
                let targets = TARGETS[step];
                let parts = getParts(limit, targets.length);
                for(let p of parts) {
                    let c_ma = 0, c_min = 0;
                    for(let i=1; i<p.length; i++) {
                        c_ma += p[i]; // 1 MA per unit upgraded
                        c_min += p[i] * (UNIT_DB[targets[i]].cost - UNIT_DB[step].cost);
                    }
                    if(c_ma <= r_ma && c_min <= r_min) {
                        let nu = [...u];
                        for(let i=0; i<p.length; i++) {
                            nu[targets[i]] += p[i];
                        }
                        path.push({s: step, p: p});
                        dfs(step+1, r_ma - c_ma, r_min - c_min, r_pop, nu, path);
                        path.pop();
                    }
                }
            } 
            // Depth 9-17: Building new units from pop
            else {
                let target_unit = step - 9;
                let cost_min = UNIT_DB[target_unit].cost;
                // Max builds limited by MA, Minerals, and Pop
                let max_build = Math.floor(Math.min(r_ma, r_min / cost_min, r_pop));
                
                for(let count=0; count<=max_build; count++) {
                    let c_ma = count; // 1 MA per build
                    let c_min = count * cost_min;
                    let c_pop = count; // 1 pop per build
                    
                    let nu = [...u];
                    nu[target_unit] += count;
                    
                    path.push({s: step, count: count});
                    dfs(step+1, r_ma - c_ma, r_min - c_min, r_pop - c_pop, nu, path);
                    path.pop();
                }
            }
        }
        
        dfs(0, init_ma - tacCost, mins, pop, [0,0,0,0,0,0,0,0,0], []);
        
        // Update Results UI
        resDiv.style.display = 'block'; resDiv.style.backgroundColor = 'var(--success-bg)';
        document.getElementById('res-current').innerText = lang === 'TW' ? `目前基礎武力 (不含陣型)： ${curr_eval.total}` : `Base Strength (Units Only): ${curr_eval.total}`;
        document.getElementById('res-max').innerText = best.str;
        
        // Strength Breakdown
        let baseStr = best.state.e.base;
        let bonusStr = best.state.e.bonus;
        document.getElementById('res-breakdown').innerText = lang === 'TW' ? `(基礎武力 ${baseStr} + 陣型加成 ${bonusStr})` : `(Base Str ${baseStr} + Tactic Bonus ${bonusStr})`;
        
        document.getElementById('res-cost').innerText = lang === 'TW' ? `消耗：${init_ma - best.state.ma} MA, ${mins - best.state.min} 礦物, ${pop - best.state.pop} 人口` : `Used: ${init_ma - best.state.ma} MA, ${mins - best.state.min} Minerals, ${pop - best.state.pop} Pop`;
        
        const list = document.getElementById('res-path-list');
        list.innerHTML = '';
        if (tacCost > 0) list.innerHTML += `<li>${lang==='TW'? (tacCost===1?'打出手中陣型 (1 MA)':'複製公共陣型 (2 MA)') : (tacCost===1?'Play Tactic from Hand (1 MA)':'Copy Common Tactic (2 MA)')}</li>`;
        
        let builtOrUpgraded = false;
        best.path.forEach(item => {
            if (item.s < 9) {
                let step = item.s, p = item.p;
                let from = UNIT_DB[step];
                for(let i=1; i<p.length; i++) {
                    if(p[i] > 0) {
                        let to = UNIT_DB[TARGETS[step][i]];
                        let maCost = p[i]; // 1 unit upgrade = 1 MA
                        let txt = lang === 'TW' ? `升級 ${from.n_tw} ➔ ${to.n_tw} x ${p[i]} (${maCost} MA)` : `Upgrade ${from.n_en} ➔ ${to.n_en} x ${p[i]} (${maCost} MA)`;
                        list.innerHTML += `<li>${txt}</li>`;
                        builtOrUpgraded = true;
                    }
                }
            } else {
                let count = item.count;
                if (count > 0) {
                    let to = UNIT_DB[item.s - 9];
                    let maCost = count; // 1 unit build = 1 MA
                    let txt = lang === 'TW' ? `建造 ${to.n_tw} x ${count} (${maCost} MA)` : `Build ${to.n_en} x ${count} (${maCost} MA)`;
                    list.innerHTML += `<li>${txt}</li>`;
                    builtOrUpgraded = true;
                }
            }
        });
        if (!builtOrUpgraded && tacCost === 0) {
            list.innerHTML += `<li>${lang==='TW'?'無須任何行動 (保持現狀)':'No actions needed (Keep as is)'}</li>`;
        }
    }
</script>
